<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>JVS 読み上げ</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>JVS 読み上げ</h1>
      </header>

      <section class="file-picker">
        <label for="text-select">テキストファイル</label>
        <select id="text-select" aria-label="読み上げるテキストを選択"></select>
        <button id="reload-btn" type="button" aria-label="一覧を更新">↻</button>
        <button id="local-file-btn" type="button" class="local-file" aria-label="端末のテキストを選択">端末から選ぶ</button>
        <input id="local-file-input" type="file" accept=".txt,text/plain" hidden />
      </section>

      <section class="voice-picker">
        <div class="picker-row" hidden>
          <label for="engine-select">エンジン</label>
          <select id="engine-select" aria-label="TTS エンジン"></select>
        </div>
        <div class="picker-row" id="voice-row" hidden>
          <label for="voice-select">話者</label>
          <select id="voice-select" aria-label="話者"></select>
        </div>
      </section>

      <section class="text-preview" aria-live="polite">
        <textarea
          id="text-content"
          placeholder="ここにテキストが表示されます"
          spellcheck="false"
        ></textarea>
        <div class="action-row">
          <button id="load-btn" type="button">このテキストを読み込む</button>
          <button id="stream-btn" type="button" class="stream">ストリーミング再生</button>
        </div>
      </section>

      <section class="player" aria-label="再生コントロール">
        <div class="status" id="status">未読み込み</div>

        <input
          id="seek"
          class="seek"
          type="range"
          min="0"
          max="0"
          step="0.01"
          value="0"
          aria-label="再生位置"
        />
        <div class="time">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>

        <div class="skip-buttons">
          <button type="button" data-skip="-60" aria-label="60秒巻き戻し">－60</button>
          <button type="button" data-skip="-10" aria-label="10秒巻き戻し">－10</button>
          <button type="button" id="play-btn" class="play" aria-label="再生/一時停止">▶</button>
          <button type="button" data-skip="10" aria-label="10秒早送り">＋10</button>
          <button type="button" data-skip="60" aria-label="60秒早送り">＋60</button>
        </div>

        <div class="speed">
          <label for="speed-range">読み上げ速度</label>
          <div class="speed-row">
            <input
              id="speed-range"
              type="range"
              min="0.5"
              max="2.0"
              step="0.1"
              value="1.0"
              aria-label="再生速度"
            />
            <span id="speed-label">1.0x</span>
          </div>
        </div>

        <div class="volume">
          <label for="volume-range">音量</label>
          <div class="volume-row">
            <button
              id="mute-btn"
              type="button"
              aria-label="ミュート切替"
              aria-pressed="false"
            >ミュート</button>
            <input
              id="volume-range"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="1"
              aria-label="音量"
            />
            <span id="volume-label">100%</span>
          </div>
        </div>
      </section>

      <audio id="audio" preload="auto" playsinline></audio>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
